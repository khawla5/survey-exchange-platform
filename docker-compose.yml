services:
  postgres:
    image: postgres:16-alpine
    container_name: sep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sep
      POSTGRES_PASSWORD: sep_dev_password
      POSTGRES_DB: survey_exchange
    ports:
      - "5433:5432"
    volumes:
      - sep_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sep -d survey_exchange"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sep-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - sep_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sep_postgres_data:
  sep_redis_data:
